<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 애진화방 🌸</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background: #FFF1F7;
    color: #333;

    min-height: 100vh;
}

/* 상단 */
.header {
    background: #FFF8FB;

    padding: 20px 15px 12px;

    text-align: center;

    border-bottom: 1px solid #F3DDE7;
}

.header h1 {
    margin: 0;

    font-size: 24px;

    color: #5A4550;

    letter-spacing: 1px;
}

/* 탭 영역 */
.apps {
    display: flex;

    justify-content: center;

    gap: 8px;

    padding: 10px 10px;

    background: #FFF8FB;
}

/* 탭 버튼 */
.app {
    width: 105px;
    height: 42px;

    background: #FFFFFF;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-decoration: none;

    color: #333;

    border: 1px solid #F5E5EC;

    box-shadow:
        0 3px 8px rgba(190, 120, 150, 0.12);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

/* 탭 이름 */
.app-name {
    font-size: 16px;

    font-weight: bold;

    color: #333;

    white-space: nowrap;
}

/* 선택된 탭 */
.app.active {
    background: #FBE1EC;

    border-color: #EFC5D5;
}

/* 클릭 효과 */
.app:active {
    transform: scale(0.95);
}

/* 프로그램 화면 */
.program {
    width: 100%;

    padding: 0;

    margin: 0;
}

/* 프로그램 */
.program iframe {
    width: 100%;

    height: calc(100vh - 105px);

    min-height: 600px;

    border: none;

    display: block;

    background: white;
}
</style>
</head>

<body>

<!-- 제목 -->
<div class="header">
    <h1>🌸 애진화방 🌸</h1>
</div>


<!-- 상단 탭 -->
<div class="apps">

    <!-- 상회 경기 -->
    <div
        class="app active"
        onclick="showProgram('https://flowersearch.github.io/PLANAJ/', this)">

        <div class="app-name">
            상회 경기
        </div>

    </div>


    <!-- 꽃 검색 -->
    <div
        class="app"
        onclick="showProgram('https://flowersearch.github.io/AJ/', this)">

        <div class="app-name">
            꽃 검색
        </div>

    </div>

</div>


<!-- 프로그램 표시 영역 -->
<div class="program">

    <iframe
        id="programFrame"
        src="https://flowersearch.github.io/PLANAJ/">
    </iframe>

</div>


<script>

function showProgram(url, button) {

    // 프로그램 변경
    document.getElementById("programFrame").src = url;


    // 모든 탭 선택 해제
    document.querySelectorAll(".app").forEach(function(app) {

        app.classList.remove("active");

    });


    // 현재 탭 선택
    button.classList.add("active");
}

</script>

</body>
</html>
